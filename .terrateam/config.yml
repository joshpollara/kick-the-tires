engine:
  name: stategraph
workflows:
  - tag_query: ""
    plan:
      - type: run
        cmd:
          - sh
          - -c
          - 'echo "==PROOF=="; echo "scenario=1-minimal"; env | grep -E "^(TF_CMD|TFENV_|TOFUENV_|TG_|STATEGRAPH_|TERRATEAM_TF_CMD|TERRATEAM_ENGINE_NAME)" | sort; echo "--tf-version--"; "${TERRATEAM_TF_CMD:-tofu}" version 2>&1 || true; echo "==END=="'
        capture_output: true
      - type: init
      - type: plan
    apply:
      - type: init
      - type: apply
