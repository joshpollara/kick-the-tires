hooks:
  all:
    pre:
      - type: run
        cmd:
          - sh
          - -c
          - >-
            curl -fsSL
            https://github.com/stategraph/releases/releases/download/2.3.35/stategraph-2.3.35-linux-amd64.tar.gz
            -o /tmp/stategraph.tar.gz
            && tar xzf /tmp/stategraph.tar.gz -C /usr/local/bin stategraph
            && chmod +x /usr/local/bin/stategraph
            && rm -f /tmp/stategraph.tar.gz
        run_on: always

access_control:
  enabled: true
  plan_require_all_dirspace_access: true
  policies:
    - tag_query: "dir:dev"
      plan: []
    - tag_query: ""
      plan: ["*"]

notifications:
  summary:
    enabled: true
    mode: pull_request

workflows:
  - tag_query: "dir:sg"
    engine:
      name: stategraph
