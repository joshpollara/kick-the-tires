hooks:
  all:
    pre:
      - type: oidc
        provider: azure
        client_id: "897e42ae-3f52-4a66-a3fc-8d9cdb622335"
        tenant_id: "8141098d-d97f-4af6-b39f-99adc0ec9cd5"
        subscription_id: "43abe8ae-641c-4cdf-8bac-77e10ac03cdd"
      - type: run
        cmd: ['sh', '-c', 'pip install azure-cli --break-system-packages']
      - type: run
        cmd: ['sh', '-c', 'az login --service-principal -u $ARM_CLIENT_ID -t $ARM_TENANT_ID --federated-token $ARM_OIDC_TOKEN']
      - type: run
        cmd: ['az', 'account', 'show']

drift:
  enabled: true
  schedules:
    default:
      tag_query: ''
      schedule: hourly
    dev-only:
      tag_query: 'dir:dev'
      schedule: daily
